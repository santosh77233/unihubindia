<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - UNIHUB INDIA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #141414; 
            color: #ffffff; 
        }
        
        /* Header */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 50px; 
            background: rgba(0,0,0,0.95); 
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { 
            font-size: 24px; 
            font-weight: 700; 
            background: linear-gradient(135deg, #e50914 0%, #f40612 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-info {
            text-align: right;
        }
        .user-name {
            font-weight: 600;
            font-size: 14px;
        }
        .user-email {
            font-size: 12px;
            color: #b3b3b3;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e50914 0%, #f40612 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
        }
        .logout-btn {
            background: rgba(229,9,20,0.2);
            border: 1px solid #e50914;
            color: #e50914;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: #e50914;
            color: white;
        }
        
        /* Layout */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: calc(100vh - 81px);
        }
        
        /* Sidebar */
        .sidebar {
            background: rgba(0,0,0,0.5);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 30px 0;
        }
        .nav-item {
            padding: 15px 30px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .nav-item.active {
            background: rgba(229,9,20,0.1);
            border-left-color: #e50914;
            color: #e50914;
        }
        
        /* Main Content */
        .main-content {
            padding: 40px 50px;
            overflow-y: auto;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(229,9,20,0.1) 0%, rgba(0,0,0,0.5) 100%);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(229,9,20,0.2);
        }
        .stat-label {
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #e50914;
        }
        
        /* Section Title */
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .add-btn {
            background: #e50914;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .add-btn:hover {
            background: #f40612;
            transform: translateY(-2px);
        }
        
        /* Application Cards */
        .applications-grid {
            display: grid;
            gap: 20px;
        }
        .application-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 25px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .application-card:hover {
            border-color: rgba(229,9,20,0.3);
            background: rgba(255,255,255,0.08);
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .college-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .college-location {
            font-size: 13px;
            color: #b3b3b3;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: rgba(255,165,0,0.2); color: #ffa500; }
        .status-submitted { background: rgba(0,123,255,0.2); color: #007bff; }
        .status-accepted { background: rgba(40,167,69,0.2); color: #28a745; }
        .status-rejected { background: rgba(220,53,69,0.2); color: #dc3545; }
        
        .app-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .detail-label {
            font-size: 12px;
            color: #808080;
        }
        .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }
        
        /* Progress Bar */
        .progress-container {
            margin: 20px 0;
        }
        .progress-label {
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .progress-bar-bg {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #e50914 0%, #f40612 100%);
            transition: width 0.3s;
        }
        
        /* Actions */
        .app-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .action-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #e50914;
            border: none;
            color: white;
        }
        .btn-primary:hover {
            background: #f40612;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ffffff;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .empty-text {
            color: #b3b3b3;
            margin-bottom: 25px;
        }
        
        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 30px;
            margin-top: 20px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255,255,255,0.1);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -35px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e50914;
            border: 2px solid #141414;
        }
        .timeline-date {
            font-size: 12px;
            color: #808080;
            margin-bottom: 5px;
        }
        .timeline-event {
            font-size: 14px;
            font-weight: 500;
        }
        
        /* Responsive */
        @media(max-width:768px){
            .dashboard-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .header {
                padding: 15px 20px;
            }
            .main-content {
                padding: 20px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .app-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">UNIHUB INDIA</div>
        <div class="user-section">
            <div class="user-info">
                <div class="user-name" id="userName">Student Name</div>
                <div class="user-email" id="userEmail">student@email.com</div>
            </div>
            <div class="user-avatar" id="userAvatar">S</div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <!-- Dashboard Layout -->
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="nav-item active" onclick="showSection('dashboard')">
                <span>📊</span> Dashboard
            </div>
            <div class="nav-item" onclick="showSection('applications')">
                <span>📝</span> My Applications
            </div>
            <div class="nav-item" onclick="showSection('search')">
                <span>🔍</span> Search Colleges
            </div>
            <div class="nav-item" onclick="showSection('deadlines')">
                <span>📅</span> Deadlines
            </div>
            <div class="nav-item" onclick="showSection('documents')">
                <span>📄</span> Documents
            </div>
            <div class="nav-item" onclick="showSection('profile')">
                <span>⚙️</span> Profile
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <!-- Content will be loaded here -->
        </div>
    </div>
    
    <script>
        // Load user data
        function loadUserData() {
            const userData = JSON.parse(localStorage.getItem('unihub_user') || '{}');
            if(!userData.email) {
                window.location.href = 'UNIHUB-login.html';
                return null;
            }
            
            document.getElementById('userName').textContent = userData.firstName + ' ' + (userData.lastName || '');
            document.getElementById('userEmail').textContent = userData.email;
            document.getElementById('userAvatar').textContent = (userData.firstName || 'S')[0].toUpperCase();
            
            return userData;
        }
        
        // Logout
        function logout() {
            localStorage.removeItem('unihub_user');
            window.location.href = 'UNIHUB-login.html';
        }
        
        // Sample application data
        const sampleApplications = [
            {
                id: 1,
                collegeName: "IIT Bombay",
                location: "Mumbai, Maharashtra",
                course: "B.Tech Computer Science",
                status: "submitted",
                appliedDate: "2024-01-15",
                deadline: "2024-03-31",
                progress: 75,
                documents: ["10th Marksheet", "12th Marksheet", "JEE Score"],
                timeline: [
                    { date: "2024-01-15", event: "Application Submitted" },
                    { date: "2024-01-20", event: "Documents Verified" },
                    { date: "2024-02-01", event: "Application Under Review" }
                ]
            },
            {
                id: 2,
                collegeName: "AIIMS Delhi",
                location: "New Delhi",
                course: "MBBS",
                status: "pending",
                appliedDate: "2024-01-20",
                deadline: "2024-04-15",
                progress: 50,
                documents: ["10th Marksheet", "12th Marksheet"],
                timeline: [
                    { date: "2024-01-20", event: "Application Started" }
                ]
            },
            {
                id: 3,
                collegeName: "IIM Ahmedabad",
                location: "Ahmedabad, Gujarat",
                course: "MBA",
                status: "accepted",
                appliedDate: "2023-12-10",
                deadline: "2024-02-28",
                progress: 100,
                documents: ["Graduation Marksheet", "CAT Score", "Work Experience"],
                timeline: [
                    { date: "2023-12-10", event: "Application Submitted" },
                    { date: "2023-12-20", event: "Shortlisted for Interview" },
                    { date: "2024-01-10", event: "Interview Completed" },
                    { date: "2024-02-01", event: "Accepted" }
                ]
            }
        ];
        
        // Show sections
        function showSection(section) {
            const content = document.getElementById('mainContent');
            
            // Update active nav
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');
            
            if(section === 'dashboard') {
                renderDashboard();
            } else if(section === 'applications') {
                renderApplications();
            } else if(section === 'search') {
                window.location.href = 'UNIHUB-INDIA-homepage.html';
            } else {
                content.innerHTML = '<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-title">Coming Soon</div><div class="empty-text">This section is under development</div></div>';
            }
        }
        
        // Render Dashboard
        function renderDashboard() {
            const content = document.getElementById('mainContent');
            const totalApps = sampleApplications.length;
            const pending = sampleApplications.filter(a => a.status === 'pending').length;
            const submitted = sampleApplications.filter(a => a.status === 'submitted').length;
            const accepted = sampleApplications.filter(a => a.status === 'accepted').length;
            
            content.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Applications</div>
                        <div class="stat-value">${totalApps}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">In Progress</div>
                        <div class="stat-value">${pending}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Submitted</div>
                        <div class="stat-value">${submitted}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Accepted</div>
                        <div class="stat-value">${accepted}</div>
                    </div>
                </div>
                
                <div class="section-title">
                    Recent Applications
                    <button class="add-btn" onclick="window.location.href='UNIHUB-INDIA-homepage.html'">+ Add New Application</button>
                </div>
                
                <div class="applications-grid">
                    ${sampleApplications.map(app => createApplicationCard(app)).join('')}
                </div>
            `;
        }
        
        // Render Applications
        function renderApplications() {
            const content = document.getElementById('mainContent');
            
            content.innerHTML = `
                <div class="section-title">
                    My Applications
                    <button class="add-btn" onclick="window.location.href='UNIHUB-INDIA-homepage.html'">+ New Application</button>
                </div>
                
                <div class="applications-grid">
                    ${sampleApplications.map(app => createDetailedApplicationCard(app)).join('')}
                </div>
            `;
        }
        
        // Create Application Card
        function createApplicationCard(app) {
            return `
                <div class="application-card">
                    <div class="app-header">
                        <div>
                            <div class="college-name">${app.collegeName}</div>
                            <div class="college-location">${app.location}</div>
                        </div>
                        <span class="status-badge status-${app.status}">${app.status.toUpperCase()}</span>
                    </div>
                    
                    <div class="app-details">
                        <div class="detail-item">
                            <div class="detail-label">Course</div>
                            <div class="detail-value">${app.course}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Applied Date</div>
                            <div class="detail-value">${app.appliedDate}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Deadline</div>
                            <div class="detail-value">${app.deadline}</div>
                        </div>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-label">
                            <span>Application Progress</span>
                            <span>${app.progress}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar" style="width: ${app.progress}%"></div>
                        </div>
                    </div>
                    
                    <div class="app-actions">
                        <button class="action-btn btn-primary">View Details</button>
                        <button class="action-btn btn-secondary">Upload Documents</button>
                    </div>
                </div>
            `;
        }
        
        // Create Detailed Application Card
        function createDetailedApplicationCard(app) {
            return `
                <div class="application-card">
                    <div class="app-header">
                        <div>
                            <div class="college-name">${app.collegeName}</div>
                            <div class="college-location">${app.location}</div>
                        </div>
                        <span class="status-badge status-${app.status}">${app.status.toUpperCase()}</span>
                    </div>
                    
                    <div class="app-details">
                        <div class="detail-item">
                            <div class="detail-label">Course</div>
                            <div class="detail-value">${app.course}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Applied Date</div>
                            <div class="detail-value">${app.appliedDate}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Deadline</div>
                            <div class="detail-value">${app.deadline}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Documents Uploaded</div>
                            <div class="detail-value">${app.documents.length} / ${app.documents.length}</div>
                        </div>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-label">
                            <span>Completion</span>
                            <span>${app.progress}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar" style="width: ${app.progress}%"></div>
                        </div>
                    </div>
                    
                    <div class="timeline">
                        ${app.timeline.map(t => `
                            <div class="timeline-item">
                                <div class="timeline-date">${t.date}</div>
                                <div class="timeline-event">${t.event}</div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="app-actions">
                        <button class="action-btn btn-primary">Continue Application</button>
                        <button class="action-btn btn-secondary">Track Status</button>
                        <button class="action-btn btn-secondary">Download Form</button>
                    </div>
                </div>
            `;
        }
        
        // Initialize
        loadUserData();
        renderDashboard();
    </script>
</body>
</html>
