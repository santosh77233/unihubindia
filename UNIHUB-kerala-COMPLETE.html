const gradients = ['grad1','grad2','grad3','grad4','grad5','grad6','grad7','grad8','grad9','grad10'];

function getInitials(name) {
    const words = name.split(' ');
    if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
}

function createCollegeCard(college, gradIndex) {
    const initials  = getInitials(college.name);
    const gradClass = gradients[gradIndex % gradients.length];
    const badge   = college.badge   ? '<div class="college-badge">' + college.badge + '</div>' : '';
    const founded = college.founded ? ' \u2022 Est. ' + college.founded : '';
    return '<div class="college-card ' + gradClass + '">' +
        badge +
        '<div class="college-content">' +
        '<div class="college-initials">' + initials + '</div>' +
        '<div>' +
        '<div class="college-name">' + college.name + '</div>' +
        '<div class="college-location">' + college.location + founded + '</div>' +
        '</div></div></div>';
}

function renderContent() {
    const content = document.getElementById('content');
    let html = '';
    let categoryIndex = 0;
    let totalCount = 0;
    for (const [category, colleges] of Object.entries(collegesData)) {
        totalCount += colleges.length;
        const cards = colleges.map(function(college, index) {
            return createCollegeCard(college, categoryIndex + index);
        }).join('');
        html += '<div class="section">' +
            '<h2 class="section-title">' + category +
            '<span class="section-count">(' + colleges.length + ' institutions)</span></h2>' +
            '<div class="scroll-container">' + cards + '</div></div>';
        categoryIndex++;
    }
    const banner = '<div style="background:linear-gradient(135deg,#43e97b 0%,#38f9d7 100%);padding:20px;border-radius:10px;margin-bottom:30px;text-align:center;color:#000;">' +
        '<h1 style="font-size:32px;margin-bottom:10px;">&#127795; Kerala - Complete Directory</h1>' +
        '<p style="font-size:18px;opacity:0.85;">' + totalCount + ' Total Institutions | ' + Object.keys(collegesData).length + ' Categories | God\'s Own Country - India\'s Most Literate State</p></div>';
    content.innerHTML = banner + html;
}

renderContent();
</script>
